<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Fight Simulator Mirror</title>
    <style>
        /* This removes all margins and forces the iframe to occupy the whole screen */
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Matches the dark Deltarune theme */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
      src="https://deltarunesim.com" 
      allow="gamepad; autoplay" 
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock">
    </iframe>

</body>
</html>
