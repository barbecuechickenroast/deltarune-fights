<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Fight Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { color: #ffff00; font-size: 2rem; }
        .window-btn {
            background-color: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
        }
        .window-btn:hover {
            box-shadow: 0px 0px 15px #ffff00;
        }
    </style>
</head>
<body>

    <h1>Deltarune Fight Sim</h1>
    <p>if this doesnt work im killing myself</p>
    
    <button class="window-btn" onclick="launchGame()">[start]</button>

    <script>
        function launchGame() {
            let params = `scrollbars=no,resizable=yes,status=no,location=no,toolbar=no,menubar=no,width=1024,height=768,left=100,top=100`;
            window.open("https://deltarunesim.com", "DeltaruneFightSim", params);
        }
    </script>

</body>
</html>
